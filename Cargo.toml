[package]
name = "vmkit"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Building blocks for running VMs on cloud-hypervisor from NixOS hosts"
license = "MIT"
repository = "https://github.com/OSSystems/vmkit-nix"
publish = false

[dependencies]
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
jiff = { version = "1.0.1", features = ["serde"] }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "process", "rt", "macros"] }
tokio-vsock = "0.7.3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "test-util"] }
